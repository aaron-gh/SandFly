name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # SHA-256 of SandFly's signing certificate. Published builds must be signed with it.
  SANDFLY_CERT_SHA256: bd5fd3c56cabfb69fdbc851aae7ba1e955c9e971caab1a8115c61243d46f576a

jobs:
  # Each APK, the unit tests and lint run in parallel jobs of their own.
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone-full
            tasks: ":assemblePhoneFullDebug"
            apks: true
          # The Google Play build uses the SandFly add-on.
          - name: phone-play
            tasks: ":assemblePhonePlayDebug :addon:assembleDebug"
            apks: true
          - name: wear-full
            tasks: ":assembleWearFullDebug"
            apks: true
          # Only the phone build, and in the app and :talkback only the full one: the watch's
          # braille keyboard is a stub, so the braille keyboard's tests don't compile for it, and
          # the rest of the code is shared. testPhoneFullDebugUnitTest exists only in the modules
          # with the full/play flavors, and testPhoneDebugUnitTest runs utils and braille.
          - name: unit-tests
            tasks: "testPhoneFullDebugUnitTest testPhoneDebugUnitTest :shizukuapi:testDebugUnitTest :addon:testDebugUnitTest"
          # The app's lint also checks the library modules. Issues already in lint-baseline.xml
          # are allowed, so this fails only on new errors, such as a call that needs a newer
          # Android than minSdk without a version check.
          - name: lint
            tasks: ":lintPhoneFullDebug"
    env:
      HAS_SANDFLY_AI: ${{ secrets.SANDFLY_AI_DEPLOY_KEY != '' }}
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 500M
    steps:
      # The full history gives the build number (commits since buildNumberBase in version.gradle) and the release notes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # SandFly AI, the paid features, from the private repository aaron-gh/sandfly-ai.
      # SANDFLY_AI_DEPLOY_KEY is the private half of a read-only deploy key of that repository.
      # Builds without it, such as pull requests from forks, have no AI features.
      - name: Check out SandFly AI
        if: env.HAS_SANDFLY_AI == 'true'
        uses: actions/checkout@v7
        with:
          repository: aaron-gh/sandfly-ai
          ssh-key: ${{ secrets.SANDFLY_AI_DEPLOY_KEY }}
          path: sandfly-ai
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6

      # ccache for the native libraries, which Gradle's build cache does not cover. shared.gradle
      # uses it when it is installed. The cache is saved again only when native code changes.
      - name: Install ccache
        if: matrix.apks
        run: command -v ccache || { sudo apt-get update -qq && sudo apt-get install -y -qq ccache; }

      - uses: actions/cache@v6
        if: matrix.apks
        with:
          path: /home/runner/.cache/ccache
          key: ccache-${{ matrix.name }}-${{ hashFiles('**/*.c', '**/*.cc', '**/*.cpp', '**/*.h', '**/*.hpp', '**/CMakeLists.txt', '**/*.cmake', '**/*.mk', 'shared.gradle') }}
          restore-keys: ccache-${{ matrix.name }}-

      # Signs builds with SandFly's key, so that installed builds update in place. Pull requests
      # from forks do not get the secrets, so they are signed with a new debug key.
      - name: Install SandFly's signing key
        if: matrix.apks
        env:
          KEYSTORE: ${{ secrets.SANDFLY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/sandfly.jks"
            echo "SANDFLY_KEYSTORE=$RUNNER_TEMP/sandfly.jks" >> "$GITHUB_ENV"
            echo "Installed SandFly's signing key."
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "The SANDFLY_KEYSTORE_BASE64 secret is missing, so the build can't be published." >&2
            exit 1
          else
            echo "No signing key secret, so the build uses a new debug key."
          fi

      # A tag v<version> builds the stable release of that version.
      - name: Check the release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^ *sandflyVersion = "\(.*\)"/\1/p' version.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but version.gradle says $version." >&2
            exit 1
          fi
          echo "GRADLE_RELEASE_FLAG=-Psandfly.release=true" >> "$GITHUB_ENV"

      # AGP downloads the SDK platform and NDK it needs if the runner lacks them.
      - name: Run ${{ matrix.tasks }}
        env:
          SANDFLY_KEY_PASSWORD: ${{ secrets.SANDFLY_KEY_PASSWORD }}
        run: ./gradlew ${{ matrix.tasks }} $GRADLE_RELEASE_FLAG --console=plain

      - name: Show ccache statistics
        if: matrix.apks
        run: ccache --show-stats

      - name: Check the signing key
        if: matrix.apks && github.event_name == 'push'
        run: |
          shopt -s nullglob
          apks=(build/outputs/apk/*/debug/*.apk addon/build/outputs/apk/debug/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APKs were built." >&2
            exit 1
          fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in "${apks[@]}"; do
            certs=$("$apksigner" verify --print-certs "$apk" 2>&1) || {
              echo "$certs" >&2
              echo "apksigner could not check $apk." >&2
              exit 1
            }
            if ! grep -q "certificate SHA-256 digest: $SANDFLY_CERT_SHA256" <<< "$certs"; then
              echo "$certs" >&2
              echo "$apk is not signed with SandFly's key." >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports-${{ matrix.name }}
          path: |
            **/build/reports/tests/
            build/reports/lint-results-phoneFullDebug.html

      - uses: actions/upload-artifact@v7
        if: matrix.apks
        with:
          name: apks-${{ matrix.name }}
          path: |
            build/outputs/apk/**/*.apk
            addon/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # Publishes the build. A push to master replaces the rolling "dev" pre-release, and a tag
  # v<version> creates the stable release, which becomes the latest release. The in-app updater
  # reads both. The first line of the notes is "build: <build number>". A development build then
  # lists its commits, each as a "- <short hash> <subject>" line, newest first. A stable release
  # has only the notes in release-notes/<version>.md, whose list items must start with "* ", not
  # "- ", which the updater shows instead of commits.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: apks-*
          merge-multiple: true
          path: apks

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(sed -n 's/^def buildNumberBase = "\([0-9a-f]*\)"/\1/p' version.gradle)
          count=$(git rev-list --count "$base..HEAD")
          hash=$(git rev-parse HEAD)
          short=${hash:0:7}
          # The full phone build is sandfly.apk, which the updater on phones looks for, and the
          # watch build is sandfly-wear.apk, which the updater on watches looks for. The Google
          # Play build and the SandFly add-on are published beside them.
          for build in sandfly-phone-full-debug:sandfly.apk sandfly-wear-full-debug:sandfly-wear.apk \
              sandfly-phone-play-debug:sandfly-play.apk addon-debug:sandfly-addon.apk; do
            apk=$(find apks -name "${build%%:*}.apk" | head -n 1)
            if [ -z "$apk" ]; then
              echo "${build%%:*}.apk was not found." >&2
              exit 1
            fi
            cp "$apk" "${build#*:}"
          done
          assets="sandfly.apk sandfly-wear.apk sandfly-play.apk sandfly-addon.apk"

          # %H cut to 7 characters, since %h can be longer when a short hash is ambiguous.
          changes() {
            git log --format='%H %s' "$@" | while IFS= read -r line; do
              echo "- ${line:0:7} ${line:41}"
            done
          }

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            notes="release-notes/${tag#v}.md"
            {
              echo "build: $count"
              echo
              if [ -f "$notes" ]; then
                cat "$notes"
              else
                echo "The written notes, $notes, are missing." >&2
                exit 1
              fi
            } > release-notes.md
            gh release create "$tag" $assets --verify-tag --latest \
              --title "SandFly ${tag#v}" --notes-file release-notes.md
            exit 0
          fi

          {
            echo "build: $count"
            echo
            changes -n 50 HEAD
          } > release-notes.md
          title="Development build $count ($short)"
          tag=dev
          if gh release view "$tag" > /dev/null 2>&1; then
            # Update the release in place. Deleting and creating it again counts as a new release,
            # which notifies everyone watching the repository.
            git tag -f "$tag" "$GITHUB_SHA"
            git push -f origin "refs/tags/$tag"
            gh release upload "$tag" $assets --clobber
            gh release edit "$tag" --title "$title" --notes-file release-notes.md --prerelease --latest=false
          else
            gh release create "$tag" $assets --prerelease --latest=false --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md
          fi
