name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Patch only affected MissingTranslation baseline entries
        run: |
          python3 - <<'PY'
          import html
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from xml.sax.saxutils import escape

          czech_files = [
              Path('talkback/src/main/res/values-cs/strings_dynamic_hints.xml'),
              Path('talkback/src/main/res/values-cs/strings_czech_update.xml'),
              Path('talkback/src/main/res/values-cs/strings_scripts.xml'),
          ]

          translated = set()
          for path in czech_files:
              root = ET.parse(path).getroot()
              for child in root:
                  name = child.attrib.get('name')
                  if name:
                      translated.add(name)

          baseline = Path('lint-baseline.xml')
          text = baseline.read_text(encoding='utf-8')
          issue_re = re.compile(r'<issue\b.*?</issue>', re.DOTALL)
          changed_names = []

          def patch_issue(match):
              block = match.group(0)
              if 'id="MissingTranslation"' not in block:
                  return block
              err = re.search(r'errorLine1="([^"]*)"', block)
              msg = re.search(r'message="([^"]*)"', block)
              if not err or not msg:
                  return block
              error_line = html.unescape(err.group(1))
              name_match = re.search(r'\bname="([^"]+)"', error_line)
              if not name_match:
                  return block
              name = name_match.group(1)
              if name not in translated:
                  return block
              old_message = html.unescape(msg.group(1))
              token = '"cs" (Czech)'
              if token not in old_message:
                  return block
              new_message = old_message.replace(token + ', ', '', 1)
              if new_message == old_message:
                  new_message = old_message.replace(', ' + token, '', 1)
              if new_message == old_message:
                  new_message = old_message.replace(token, '', 1)
              if new_message == old_message:
                  return block
              escaped = escape(new_message, {'"': '&quot;'})
              changed_names.append(name)
              return block[:msg.start(1)] + escaped + block[msg.end(1):]

          patched = issue_re.sub(patch_issue, text)
          if not changed_names:
              raise SystemExit('No affected MissingTranslation baseline entries were found.')
          baseline.write_text(patched, encoding='utf-8', newline='')
          print(f'Patched {len(changed_names)} baseline entries.')
          for name in changed_names:
              print(name)
          print(f'Baseline size: {baseline.stat().st_size} bytes')
          PY

      - name: Run lint against minimally patched baseline
        run: ./gradlew :lintPhoneDebug --console=plain

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-baseline-patched
          path: lint-baseline.xml
