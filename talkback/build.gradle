plugins {
    id 'com.android.library'
}

apply from: "../shared.gradle"

// Declared before the dependencies, which use the flavors' configurations.
android {
    // full: published on GitHub; it updates itself and uses Shizuku itself. play: published on
    // Google Play; it uses Shizuku through the SandFly add-on. See distribution/Distribution.kt.
    flavorDimensions = ["target", "distribution"]
    productFlavors {
        full {
            dimension = "distribution"
        }
        play {
            dimension = "distribution"
        }
    }
}

dependencies {
    implementation project(':proguard')
    implementation project(':utils')
    implementation project(':brailleime')
    phoneImplementation project(':braillecommon')
    phoneImplementation project(':brailletranslate')
    implementation project(':brailleinterfaces')
    implementation project(':brailledisplay')
    implementation project(':materialflags')
    implementation project(':materialpreference')
    // TODO: Define different dependencies for different product flavors
    wearImplementation project(':materialpreferencecompose')
    wearImplementation project(':materialtheme')
    // Scripts run in Lua 5.4 through LuaJava.
    phoneImplementation libs.luajava
    phoneImplementation libs.luajava.lua54
    phoneImplementation project(':luamemory')
    // Handwriting recognition on the device, with a model per language downloaded when first used.
    phoneImplementation libs.mlkit.digital.ink
    // Translation on the device, with a model per language downloaded when first used.
    phoneImplementation libs.mlkit.translate
    // The Lua 5.4 library for each Android ABI, and for the computer that runs the unit tests.
    phoneRuntimeOnly "party.iroiro.luajava:android:${libs.versions.luajava.get()}:lua54@aar"
    testPhoneRuntimeOnly "party.iroiro.luajava:lua54-platform:${libs.versions.luajava.get()}:natives-desktop"
    implementation libs.litertlm
    // WebSockets, for Rambler live transcription.
    implementation libs.okhttp
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view
    // Dictation with Whisper on the phone.
    phoneImplementation project(':whisper')
    // Whisper on Adreno GPUs, loaded only when used there.
    phoneRuntimeOnly project(':whisperopencl')
    // The shell service's interface and commands, which scripts and SandFly AI use too.
    api project(':shizukuapi')
    // Grants the permissions that settings need through Shizuku, when it is installed and running.
    // The Google Play build uses Shizuku through the SandFly add-on instead.
    fullImplementation libs.shizuku.api
    fullImplementation libs.shizuku.provider
    fullImplementation project(':shizukuservice')
    testImplementation libs.junit
    testImplementation libs.json
    testImplementation libs.robolectric
}

// Gemini settings come from local.properties, which is not committed, so each builder uses their own key.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def geminiApiKey = localProperties.getProperty('gemini.api.key', '')
def geminiModel = localProperties.getProperty('gemini.model', 'gemini-flash-latest')

android {
    namespace = "com.google.android.accessibility.talkback"
    defaultConfig {
        buildConfigField("String", "APPLICATION_ID", '"' + talkbackApplicationId + '"')
        buildConfigField("String", "GEMINI_API_KEY", '"' + geminiApiKey + '"')
        buildConfigField("String", "GEMINI_MODEL", '"' + geminiModel + '"')
        // Used by the updater to compare this build with the latest development build.
        buildConfigField("String", "COMMIT_HASH", '"' + rootProject.gitCommitHash + '"')
        buildConfigField("int", "COMMIT_COUNT", String.valueOf(rootProject.gitCommitCount))
        buildConfigField("String", "SANDFLY_VERSION", '"' + rootProject.sandflyVersionName + '"')
    }
    // Robolectric tests read the module's strings.
    testOptions.unitTests.includeAndroidResources = true
    // The file format reference starts with the description of item files.
    sourceSets.main.assets.srcDirs += "$rootDir/docs/reference"
    buildFeatures {
        aidl = true
    }
}

// The Robolectric tests run in one JVM, and Gradle's default 512 MB heap runs out near the end.
tasks.withType(Test).configureEach {
    maxHeapSize = "2g"
}

// The user guide: its chapter files, and the documents in docs/ that its appendices include.
abstract class UserGuideAssets extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getGuide()

    @InputFiles
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract ConfigurableFileCollection getIncluded()

    @OutputDirectory
    abstract DirectoryProperty getOutput()

    @javax.inject.Inject
    abstract FileSystemOperations getFiles()

    @TaskAction
    void copy() {
        def guideDir = guide.get().asFile
        def includedFiles = included.files
        files.sync {
            into(output.get().asFile)
            from(guideDir) {
                include '*/*.md'
                into 'user-guide'
            }
            from(includedFiles) {
                into 'user-guide/api'
            }
        }
    }
}

def userGuideAssets = tasks.register('userGuideAssets', UserGuideAssets) {
    guide = rootProject.layout.projectDirectory.dir('docs/user-guide')
    included.from(['scripting.md', 'speech-api.md', 'braille-display-api.md', 'direct-touch-api.md', 'reference/item-files.md']
        .collect { rootProject.file("docs/$it") })
    output = layout.buildDirectory.dir('generated/userGuideAssets')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(userGuideAssets, { it.output })
    }
}

// Watches have only the full build.
androidComponents {
    beforeVariants(selector().all()) { variant ->
        def flavors = variant.productFlavors.collect { it.second }
        if (flavors.contains('wear') && flavors.contains('play')) variant.enable = false
    }
}
