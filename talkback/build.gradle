plugins {
    id 'com.android.library'
}

apply from: "../shared.gradle"

dependencies {
    implementation project(':proguard')
    implementation project(':utils')
    implementation project(':brailleime')
    phoneImplementation project(':braillecommon')
    implementation project(':brailleinterfaces')
    implementation project(':brailledisplay')
    implementation project(':materialflags')
    implementation project(':materialpreference')
    // TODO: Define different dependencies for different product flavors
    wearImplementation project(':materialpreferencecompose')
    wearImplementation project(':materialtheme')
    // Scripts run in Lua 5.4 through LuaJava.
    phoneImplementation libs.luajava
    phoneImplementation libs.luajava.lua54
    // Handwriting recognition on the device, with a model per language downloaded when first used.
    phoneImplementation libs.mlkit.digital.ink
    // Translation on the device, with a model per language downloaded when first used.
    phoneImplementation libs.mlkit.translate
    // The Lua 5.4 library for each Android ABI, and for the computer that runs the unit tests.
    phoneRuntimeOnly "party.iroiro.luajava:android:${libs.versions.luajava.get()}:lua54@aar"
    testPhoneRuntimeOnly "party.iroiro.luajava:lua54-platform:${libs.versions.luajava.get()}:natives-desktop"
    implementation libs.litertlm
    // WebSockets, for Rambler live transcription.
    implementation libs.okhttp
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view
    // Dictation with Whisper on the phone.
    phoneImplementation project(':whisper')
    // Whisper on Adreno GPUs, loaded only when used there.
    phoneRuntimeOnly project(':whisperopencl')
    // Grants the permissions that settings need through Shizuku, when it is installed and running.
    implementation libs.shizuku.api
    implementation libs.shizuku.provider
    testImplementation libs.junit
    testImplementation libs.json
    testImplementation libs.robolectric
}

// Gemini settings come from local.properties, which is not committed, so each builder uses their own key.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def geminiApiKey = localProperties.getProperty('gemini.api.key', '')
def geminiModel = localProperties.getProperty('gemini.model', 'gemini-flash-latest')

android {
    namespace = "com.google.android.accessibility.talkback"
    defaultConfig {
        buildConfigField("String", "APPLICATION_ID", '"' + talkbackApplicationId + '"')
        buildConfigField("String", "GEMINI_API_KEY", '"' + geminiApiKey + '"')
        buildConfigField("String", "GEMINI_MODEL", '"' + geminiModel + '"')
        // Used by the updater to compare this build with the latest development build.
        buildConfigField("String", "COMMIT_HASH", '"' + rootProject.gitCommitHash + '"')
        buildConfigField("int", "COMMIT_COUNT", String.valueOf(rootProject.gitCommitCount))
        buildConfigField("String", "SANDFLY_VERSION", '"' + rootProject.sandflyVersionName + '"')
    }
    // Robolectric tests read the module's strings.
    testOptions.unitTests.includeAndroidResources = true
    buildFeatures {
        aidl = true
    }
}
