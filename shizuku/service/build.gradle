plugins {
    id 'com.android.library'
}

// The shell service that Shizuku runs as the shell user, in SandFly's full build and in the SandFly
// add-on.
android {
    namespace = "io.github.aaron_gh.sandfly.shizuku.service"
    compileSdk {
        version = release(37) { minorApiLevel = 2 }
    }
    ndkVersion = "27.3.13750724"
    defaultConfig {
        minSdk = 26
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
            version = "3.22.1"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    api project(':shizukuapi')
}
