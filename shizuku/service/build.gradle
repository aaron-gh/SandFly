plugins {
    id 'com.android.library'
}

// The shell service that Shizuku runs as the shell user, in SandFly's full build and in the SandFly
// add-on.
android {
    namespace = "io.github.aaron_gh.sandfly.shizuku.service"
    compileSdk = 37
    defaultConfig {
        minSdk = 26
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    api project(':shizukuapi')
}
