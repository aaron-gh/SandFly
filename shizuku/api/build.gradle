plugins {
    id 'com.android.library'
}

// What SandFly and the SandFly add-on share to run commands as the shell user: the shell service's
// interface and commands, and the add-on's interface.
android {
    namespace = "io.github.aaron_gh.sandfly.shizuku.api"
    compileSdk = 37
    defaultConfig {
        minSdk = 26
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        aidl = true
    }
}

dependencies {
    testImplementation libs.junit
}
