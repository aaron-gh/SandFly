// For building the open-source release of TalkBack.

// Kotlin 2 compiles Compose through this compiler plugin instead of composeOptions.
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

ext {
    talkbackApplicationId = "io.github.aaron_gh.backtalk"
}

android {
    compileSdk = 37
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    defaultConfig {
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled = true
        minSdk = 26
        ndk {
            // x86_64 for emulators on Intel and AMD computers, such as Windows PCs,
            // whose plain Android images can't run ARM code.
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
        // We generate a build config field holding the application ID so that
        // Java code can reference it.
        buildConfigField "String", "APPLICATION_ID", "\"" + talkbackApplicationId + "\""
        // We generate a string resource holding the application ID so that XML
        // resources can reference it.
        resValue "string", "app_id", talkbackApplicationId
    }
    flavorDimensions = ["target"]
    productFlavors {
        phone {
            dimension = "target"
        }
        wear {
            dimension = "target"
        }
    }
    buildFeatures {
        buildConfig = true
        compose = true
        resValues = true
    }
}

dependencies {

    // Google common
    implementation libs.mlkit.text.recognition
    implementation libs.material

    // Support library
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.collection
    implementation libs.androidx.core
    implementation libs.androidx.core.i18n
    implementation libs.androidx.fragment
    implementation libs.androidx.lifecycle.service
    implementation libs.androidx.savedstate
    implementation libs.androidx.localbroadcastmanager
    implementation libs.androidx.preference
    implementation libs.androidx.recyclerview
    implementation libs.androidx.viewpager2

    // Guava and annotations used directly by the sources
    implementation libs.guava
    implementation libs.checker.qual
    implementation libs.errorprone.annotations

    // Auto-value
    implementation libs.auto.value.annotations
    annotationProcessor libs.auto.value
    implementation libs.javax.annotation.api

    // Wear
    implementation libs.androidx.wear
    implementation libs.androidx.wear.remote.interactions
    implementation libs.wearable.support
    implementation libs.zxing.core

    // Cloud services
    implementation libs.volley

    // Compose libraries for all form factors
    implementation libs.androidx.activity
    implementation libs.androidx.activity.compose
    implementation libs.compose.runtime
    implementation libs.compose.runtime.livedata
    implementation libs.compose.ui
    implementation libs.wear.compose.foundation
    implementation libs.wear.compose.material3
    implementation libs.compose.material.icons.core

    // Gemineye
    implementation libs.gson
    implementation libs.protobuf.javalite
    implementation libs.flexbox

    // Apache
    implementation libs.commons.text

}
