[versions]
agp = "9.4.1"
kotlin = "2.4.21"
autoValue = "1.11.1"
compose = "1.12.1"
wearCompose = "1.7.1"
activity = "1.13.0"

[libraries]
# Google common
mlkit-text-recognition = "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1"
material = "com.google.android.material:material:1.14.0"

# Testing
junit = "junit:junit:4.13.2"
robolectric = "org.robolectric:robolectric:4.17"
json = "org.json:json:20250517"

# AndroidX
androidx-annotation = "androidx.annotation:annotation:1.11.0"
androidx-appcompat = "androidx.appcompat:appcompat:1.8.0"
androidx-collection = "androidx.collection:collection:1.7.0"
androidx-core = "androidx.core:core:1.19.1"
androidx-core-i18n = "androidx.core:core-i18n:1.0.0"
androidx-fragment = "androidx.fragment:fragment:1.9.1"
androidx-lifecycle-service = "androidx.lifecycle:lifecycle-service:2.11.0"
androidx-savedstate = "androidx.savedstate:savedstate:1.5.0"
androidx-localbroadcastmanager = "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
androidx-preference = "androidx.preference:preference:1.2.1"
androidx-recyclerview = "androidx.recyclerview:recyclerview:1.4.0"
androidx-viewpager2 = "androidx.viewpager2:viewpager2:1.1.0"

# Used directly by the TalkBack sources
guava = "com.google.guava:guava:33.7.2-android"
checker-qual = "org.checkerframework:checker-qual:4.3.1"
errorprone-annotations = "com.google.errorprone:error_prone_annotations:2.50.0"

# Auto-value
auto-value-annotations = { module = "com.google.auto.value:auto-value-annotations", version.ref = "autoValue" }
auto-value = { module = "com.google.auto.value:auto-value", version.ref = "autoValue" }
javax-annotation-api = "javax.annotation:javax.annotation-api:1.3.2"

# Wear
androidx-wear = "androidx.wear:wear:1.4.0"
androidx-wear-remote-interactions = "androidx.wear:wear-remote-interactions:1.2.0"
wearable-support = "com.google.android.support:wearable:2.9.0"
zxing-core = "com.google.zxing:core:3.5.4"

# On-device AI
litertlm = "com.google.ai.edge.litertlm:litertlm-android:0.18.0"

# Cloud services
volley = "com.android.volley:volley:1.2.1"

# Compose
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-material-icons-core = "androidx.compose.material:material-icons-core:1.7.8"
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }

# Gemineye
gson = "com.google.code.gson:gson:2.14.0"
protobuf-javalite = "com.google.protobuf:protobuf-javalite:4.36.2"
flexbox = "com.google.android.flexbox:flexbox:3.0.0"

# Apache
commons-text = "org.apache.commons:commons-text:1.15.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
