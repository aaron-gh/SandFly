name = "sandfly-reports"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# The private repository that receives the reports.
REPO = "aaron-gh/SandFly-reports"

# Two reports a minute from one address.
[[ratelimits]]
name = "PER_ADDRESS"
namespace_id = "1001"
simple = { limit = 2, period = 60 }

# Daily report counts. Create with: npx wrangler kv namespace create COUNTS
[[kv_namespaces]]
binding = "COUNTS"
id = "7e7bb2e21f4f47c1b568a8223c9157b8"

# The issue of each report, by the SHA-256 of the report's token.
[[kv_namespaces]]
binding = "THREADS"
id = "4ee8434394b8491eaffb9aa887733902"
