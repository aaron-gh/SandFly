plugins {
    id 'com.android.library'
}

apply from: "../shared.gradle"

// whisper.cpp with its OpenCL backend, for Whisper on Adreno GPUs. A library of its own, since it
// needs the GPU vendor's libOpenCL.so and so is loaded only on phones that use the GPU for Whisper.
android {
    namespace = "com.google.android.accessibility.whisper.opencl"
    ndkVersion = "27.3.13750724"
    defaultConfig {
        ndk {
            // Adreno GPUs are in 64-bit ARM phones.
            abiFilters.clear()
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }
    lint {
        // 64-bit ARM only on purpose: no other ABI has an Adreno GPU.
        disable 'ChromeOsAbiSupport'
    }
    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = "3.22.1"
        }
    }
}
