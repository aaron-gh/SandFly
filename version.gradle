ext { talkbackVersionName = "TfPu_release_16_2" }

// SandFly's version. A stable release is built with -Psandfly.release=true and tagged
// v<version>; other builds are <version>-dev. Raise it after each stable release.
ext {
    sandflyVersion = "0.1.6"
    sandflyVersionName = sandflyVersion + (providers.gradleProperty("sandfly.release").getOrElse("false") == "true" ? "" : "-dev")
}

// Git details for the in-app updater. Builds outside a git checkout fall back to build 1 and no hash.
def gitOutput = { List<String> args ->
    try {
        return providers.exec {
            commandLine(['git'] + args)
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        return ''
    }
}
// SandFly's build number is the number of commits since the last commit before SandFly numbered
// its own builds, so the first one is build 1. The publish job in .github/workflows/build.yml
// counts the same way.
def buildNumberBase = "699e30f8e359e5e047e15149ddc407ea9ca13107"
def commitCount = gitOutput(['rev-list', '--count', "${buildNumberBase}..HEAD"])
def commitHash = gitOutput(['rev-parse', 'HEAD'])
ext {
    gitCommitCount = commitCount.isInteger() ? Math.max(commitCount.toInteger(), 1) : 1
    gitCommitHash = commitHash ==~ /[0-9a-f]{40}/ ? commitHash : ''
}
